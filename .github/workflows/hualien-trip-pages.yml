name: Deploy Hualien Trip Map

on:
  push:
    branches: [main]
    paths:
      - 'hualien-trip-map/**'
      - '.github/workflows/hualien-trip-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hualien-trip-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Hualien map
        uses: actions/upload-pages-artifact@v4
        with:
          path: hualien-trip-map

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
