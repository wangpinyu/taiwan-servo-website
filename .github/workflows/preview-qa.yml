name: Preview QA

on:
  push:
    branches:
      - main
      - 'phase-*'
      - 'source-audit-*'
  pull_request:
    branches:
      - main
      - 'phase-*'
      - 'source-audit-*'
  workflow_dispatch:

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate local preview strictly
        run: npm run validate:strict

      - name: Upload QA reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taiwan-servo-preview-reports
          path: |
            site/reports/**/*.html
            site/reports/**/*.json
            site/reports/**/*.md
