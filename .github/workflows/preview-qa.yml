name: Preview QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate local preview
        run: npm run validate

      - name: Upload QA reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taiwan-servo-preview-reports
          path: |
            site/reports/*.html
            site/reports/*.json
            site/reports/github-issues/*.md
